[workspace]
resolver = "2"
members = [
    "crates/glaux-core",
    "crates/glaux-mcp",
    "crates/glaux-engine",
    "crates/glaux-dsp",
    "crates/glaux-ml",
    "crates/glaux-clap",
    "app/src-tauri",
    "crates/glaux-godot",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Godot 4 の拡張(glaux-godot)。4.3 以降の Godot で動くよう 4.3 の API に合わせる。
# 音声スレッドから呼ばれる AudioStreamPlayback を実装するため experimental-threads が要る
godot = { version = "0.5", features = ["api-4-3", "experimental-threads"] }
# AudioStreamPlayback::_mix の引数の型(RawPtr)が godot から再公開されていないので直接使う(版は godot と揃える)
godot-core = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# glaux-mcp(rmcp は MSRV 1.88 を要求するので glaux-mcp の rust-version は個別指定)
rmcp = { version = "3.4", features = ["transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# app(Tauri)
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
axum = "0.8"
# glaux-engine
cpal = "0.18"
arc-swap = "1"
hound = "3"
sha2 = "0.10"
rustysynth = "1.3"
rustfft = "6"
# 学習済みモデルの推論(pure Rust の ONNX ランタイム。glaux-ml のみ)
tract-onnx = "0.23"
# CLAP プラグインのホスト(glaux-clap のみ)
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "note-ports", "params", "state", "thread-check", "log", "latency", "gui", "preset-discovery"] }
# CLAP プラグインの状態をプロジェクトに書く
base64 = "0.22"
# Windows でプラグインの画面を入れるウィンドウ(glaux-clap のみ)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
# ラウドネス(EBU R128: 短期・LRA・True Peak)
ebur128 = "0.1"
# MIDI キーボード入力
midir = "0.11"
# 追加モデル(CLAP の音声側など)の取得(glaux-mcp のみ。プロキシは環境変数に従う)
ureq = "3"
# 似た音を作る(内蔵シンセのつまみの自動合わせ)。描画機能は使わない
cmaes = { version = "0.2", default-features = false }
# 音声ファイルの取り込み(mp3 / flac / ogg / m4a を WAV に変換)
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm"] }

# tauri dev(デバッグビルド)でもオーディオ経路は最適化する。
# レンダラ・DSP・FFT が debug のままだと CPU 余裕が減り、analyze/export も遅い。
# 開発版(tauri dev / cargo test)でも外部クレートは最適化する。解析(ebur128 等)・推論・取り込み・保存が
# 最適化なしでは数十倍遅い(ebur128 は 69 秒の音で 5.1 秒 → 0.08 秒)。個別に 3 を指定したものはそちらが優先
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.glaux-core]
opt-level = 2
[profile.dev.package.glaux-dsp]
opt-level = 3
[profile.dev.package.glaux-engine]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.hound]
opt-level = 3

[profile.dev.package.glaux-ml]
opt-level = 3
[profile.dev.package.cmaes]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
