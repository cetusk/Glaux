[package]
name = "glaux-app"
version = "0.1.1"
edition.workspace = true
# rmcp / tauri の要求に合わせる(workspace の 1.75 より新しい)
rust-version = "1.89"
license.workspace = true
description = "Glaux desktop app (Tauri): UI + in-process MCP server sharing one Session"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
glaux-core = { path = "../../crates/glaux-core" }
glaux-mcp = { path = "../../crates/glaux-mcp" }
glaux-engine = { path = "../../crates/glaux-engine" }
glaux-dsp = { path = "../../crates/glaux-dsp" }
chrono.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
axum.workspace = true
# process / io-util はアプリ内チャット(ヘッドレス claude の起動と NDJSON 読み取り)用
tokio = { workspace = true, features = ["process", "io-util"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
