[package]
name = "glaux-mcp"
version = "0.2.0"
edition.workspace = true
# rmcp が 1.88 を要求するため、workspace の 1.75 より新しい MSRV を個別指定
rust-version = "1.89"
license.workspace = true
description = "MCP server exposing the Glaux Session (project model + git-like history) to AI clients"

[dependencies]
glaux-core = { path = "../glaux-core" }
glaux-dsp = { path = "../glaux-dsp" }
glaux-engine = { path = "../glaux-engine" }
glaux-ml = { path = "../glaux-ml" }
glaux-clap = { path = "../glaux-clap" }
cmaes.workspace = true
rmcp.workspace = true
chrono.workspace = true
sha2.workspace = true
ureq.workspace = true
base64.workspace = true
hound.workspace = true
symphonia.workspace = true
midly.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
# インプロセス(duplex)でクライアント⇔サーバーを繋ぐエンドツーエンドテスト用
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["io-util"] }
